<style>
/*@FONTS*/
:root{
  --bg:#0e0f11; --bar:#121316; --panel:#16181b; --panel2:#1c1f23; --edge:#2a2d33; --edge2:#33373d; --fg:#d9dce1; --hi:#ffffff; --dim:#8b9099;
  --bad:#e5534b; --warn:#e8a33a; --info:#6b8fc7; --ok:#6aa86a;
  --ui:Arimo,Arial,"Helvetica Neue",sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font:14px/1.45 var(--ui);min-height:100dvh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #9fb4d8;outline-offset:2px}
/* ---------- top bar ---------- */
.bar{background:var(--bar);border-bottom:1px solid #23262b;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bar-in{max-width:1440px;margin:0 auto;padding:6px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.logo{display:flex;align-items:center;gap:9px;padding-right:6px;white-space:nowrap}
.logo .bc{width:28px;height:28px;border-radius:6px;background:var(--fg);color:var(--bg);font:700 12px var(--mono);display:flex;align-items:center;justify-content:center}
.logo span+span{font-weight:700;font-size:14px}
.tabs{display:flex;gap:2px}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:11px 10px 9px;min-height:44px;color:var(--dim);font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tabs button[aria-selected=true]{color:var(--hi);border-bottom-color:var(--fg)}
.badge{font:700 12px var(--mono);color:var(--warn)}
.badge.ok{color:var(--ok)}
.grow{flex:1 1 auto}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.key{font:12.5px var(--mono);color:var(--dim);padding:0 6px;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key.bad{color:#f08a84;white-space:normal}
.btn{background:var(--panel2);border:1px solid var(--edge2);border-radius:6px;padding:8px 13px;min-height:38px;font-size:13.5px;color:var(--fg);white-space:nowrap}
.btn:hover,.ic:hover{background:#24272c}
.sep{width:1px;height:24px;background:var(--edge);margin:0 3px}
.seg{display:flex;border:1px solid var(--edge2);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;padding:8px 11px;min-height:38px;min-width:38px;color:var(--dim);font:600 12.5px var(--mono)}
.seg button+button{border-left:1px solid var(--edge2)}
.seg button[aria-pressed=true]{background:#2a2d33;color:var(--hi)}
.ic{width:38px;height:38px;border-radius:6px;border:1px solid var(--edge2);background:transparent;color:#b4b8bf;display:flex;align-items:center;justify-content:center;padding:0;font:600 14px var(--mono)}
.ic[aria-pressed=true]{background:#2a2d33;color:var(--hi)}
.ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.menu{display:none}
/* every text of the bar stays on one line; when room runs out, the secondary items go, never a line break */
.bar,.bar button,.bar span{white-space:nowrap}
/* "Gear": the tab that shows the booth, with a summary of the setup; it opens the booth panel */
.tabs .gearbtn{gap:8px}.gearbtn .sum{font:12px var(--mono);color:var(--dim)}.gearbtn svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.gearbtn[aria-expanded=true] svg{transform:rotate(180deg)}
.gear{position:fixed;z-index:75;width:400px;max-width:calc(100vw - 16px);background:var(--panel);border:1px solid var(--edge2);border-radius:10px;padding:14px;box-shadow:0 12px 32px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:8px;font-size:13px}
.gear .lab{font:11.5px var(--mono);color:var(--dim)}
.gear .slots{display:flex;gap:6px}
.slot{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:52px;padding:4px;background:var(--panel2);border:1px solid var(--edge2);border-radius:6px;color:var(--hi);font:700 13px var(--ui);overflow:hidden}
.slot small{font:11px var(--mono);font-weight:400;color:var(--dim)}
.slot.empty{background:transparent;border-style:dashed;color:var(--dim);font-weight:400}
.slot:hover{border-color:#4a4f57}.slot[aria-pressed=true]{border-color:#9fb4d8;box-shadow:inset 0 0 0 1px #9fb4d8}
.gear h3{margin:6px 0 0;font:700 13px var(--ui);color:var(--hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gear .opt{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:var(--panel2);border:1px solid var(--edge2);border-radius:6px;padding:8px 10px;min-height:38px;text-align:left;white-space:nowrap}
.gear .opt[aria-pressed=true]{border-color:#9fb4d8;color:var(--hi)}
.gear .opt.soon{background:transparent;color:var(--dim)}
.gear .tag{font:11px var(--mono);color:var(--dim);border:1px solid var(--edge2);border-radius:4px;padding:0 5px}
.gear .cols{display:flex;gap:6px}.gear .cols .opt{flex:1}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid #5a5f67;vertical-align:-2px;margin-right:6px}
.sw.black{background:#141416}.sw.white{background:#e9e9e6}
.gear .rm{align-self:flex-start;background:none;border:0;padding:4px 2px 0;color:#f08a84;text-decoration:underline;text-underline-offset:2px}
/* ---------- the controller button and panel ---------- */
.ctl{position:relative}
.ctl .dot{position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%;background:#4a4f57}.ctl.on .dot{background:var(--ok)}
.midi{width:460px;overflow:auto}
.midi .note{margin:0;font-size:12.5px;color:var(--dim)}
.midi .tag.on{color:var(--ok);border-color:#3d5a3d}
.midi .link{background:none;border:0;padding:0;color:#9fb4d8;text-decoration:underline;text-underline-offset:2px;font-size:12.5px}
.midi .side{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.midi .side .seg button{min-height:32px;padding:5px 10px}
.midi .last{font:12px var(--mono);color:var(--fg);background:var(--bg);border:1px solid var(--edge);border-radius:6px;padding:7px 9px;min-height:32px}
.midi .last .old{color:var(--dim)}
.midi .diag input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--edge2);border-radius:5px;color:var(--fg);padding:6px 8px;font-size:12.5px}
.midi .learn{margin:0;font-size:12.5px;color:var(--warn)}
.midi details summary{cursor:pointer;font-size:13px;color:var(--hi);padding:4px 0}
.midi .grp{font:11.5px var(--mono);color:var(--dim);margin:10px 0 4px}
.midi .row{display:flex;align-items:center;gap:6px;padding:3px 0;border-top:1px solid var(--edge);font-size:12.5px}
.midi .row .fn{flex:1;min-width:0}.midi .row .mk{font:11.5px var(--mono);color:var(--dim);white-space:nowrap}
.midi .mini{background:var(--panel2);border:1px solid var(--edge2);border-radius:5px;padding:3px 8px;font-size:12px;color:var(--fg);min-width:28px}
.midi .mini.on{border-color:var(--warn);color:var(--warn)}.midi .mini.x{color:#f08a84}.midi .mini.sp{visibility:hidden;border:0;padding:3px 8px}
.ic.menu{display:none}
/* narrower windows: first the USB name, then the site name and the setup summary */
@media (max-width:1279px){#srcInfo{display:none}}
@media (max-width:1100px){.logo span+span,.gearbtn .sum{display:none}}
@media (max-width:900px){
  .bar{position:relative}
  .bar-in{flex-wrap:nowrap;gap:8px;padding:4px 12px}
  .tabs button{padding:10px 8px 8px;font-size:13.5px}
  .tabs .long{display:none}
  .ic.menu{display:flex;flex:none}
  .tools{display:none;position:absolute;right:8px;top:calc(100% + 4px);z-index:74;width:min(330px,calc(100vw - 16px));background:var(--panel);border:1px solid var(--edge2);border-radius:10px;padding:12px;box-shadow:0 12px 32px rgba(0,0,0,.55);gap:8px}
  .tools.open{display:flex}.tools #srcInfo{display:block;max-width:100%;flex-basis:100%;padding:0}.tools .sep{display:none}
  .status .hints{display:none}
}
@media (min-width:901px){.tabs .short{display:none}}
@media (max-width:900px) and (max-height:500px){footer{display:none}}
/* ---------- main ---------- */
main{flex:1;width:100%;max-width:1440px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
body.two main,body.mix main{max-width:none}
.decks{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;overflow-x:auto}
/* centred, but scrolls from the left edge when the decks are made larger than the window */
.decks>.first{margin-left:auto}.decks>.last{margin-right:auto}
@media (min-width:901px){body.two .decks,body.mix .decks{flex-wrap:nowrap}}
@media (max-width:900px){.deckwrap{margin-left:auto!important;margin-right:auto!important}}
:root{--side:0px;--sc:1;--n:1;--units:1;--items:1}
body[data-n="2"]{--n:2}body[data-n="3"]{--n:3}body[data-n="4"]{--n:4}
body.keys{--side:320px}
/* fitted size, then the user's scale (− / +) */
.deckwrap{display:flex;flex-direction:column;align-items:center;flex:none;--fit:min(calc((100vw - 32px - var(--side) - (var(--items) - 1) * 14px) / var(--units)),calc((100dvh - var(--top,52px) - 68px) * 924 / 1196),924px);--fw:calc(var(--fit) * var(--sc))}
@media (max-width:900px){body{--side:0px!important}body.two .deckwrap,body.mix .deckwrap{--fit:min(calc((100vw - 32px) / 1.0407),calc((100dvh - var(--top,52px) - 68px) * 924 / 1196))}}
/* the mixer: 333 mm wide beside the 320 mm players, same depth, fronts aligned */
#faceM{display:block;max-width:none;user-select:none;-webkit-user-select:none;touch-action:none;width:calc(var(--fw) * 1.0407);aspect-ratio:2208/2619;margin-top:calc(var(--fw) * .0600)}
#wrapM .status{width:calc(var(--fw) * 1.0407)}
canvas.face{display:block;width:var(--fw);max-width:none;aspect-ratio:924/1196;user-select:none;-webkit-user-select:none;touch-action:none;background:transparent}
.status{width:var(--fw);height:26px;display:flex;gap:14px;align-items:center;background:#0b0b0c;padding:0 12px;font:12px var(--ui);color:#7d828a;border-radius:6px;margin-top:6px;overflow:hidden}
.status b{color:#b9bdc4;font-weight:700;white-space:nowrap}
.status .st{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .st.warn{color:#c89a4a}
.status .hints{white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.status .hints{display:none}}
body[data-n="3"] .status .hints,body[data-n="4"] .status .hints{display:none}
/* booth only: the decks alone, full screen, on black */
body.solo{background:var(--bg);--side:0px!important}
body.solo .keyside{display:none!important}
body.solo .bar,body.solo footer,body.solo .status{display:none!important}
body.solo main{max-width:none;padding:0;display:flex;align-items:center;justify-content:center;min-height:100dvh}
body.solo .deckwrap{--fw:min(calc((100vw - (var(--items) - 1) * 8px) / var(--units)),calc(100dvh * 924 / 1196))}
body.solo .decks{flex-wrap:nowrap;gap:8px}
/* ---------- footer ---------- */
footer{position:relative;width:100%;padding:12px 20px 16px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 24px;font:11.5px/1.5 var(--mono);color:#7a7f87}
footer button{background:none;border:0;padding:0;font:inherit;color:#b4b8bf;text-decoration:underline;text-underline-offset:2px}
footer button:hover{color:#fff}
/* ---------- enlarged screen ---------- */
#lcdZoom{display:none}
.zbar{display:none}
body.zoom #lcdZoom{display:block;position:fixed;left:50%;top:12px;transform:translateX(-50%);width:min(96vw,calc((100dvh - 120px)*800/480));aspect-ratio:800/480;z-index:60;border:2px solid #2a2d33;border-radius:6px;box-shadow:0 0 0 100vmax #000d;touch-action:none}
body.zoom .zbar{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;position:fixed;left:0;right:0;bottom:10px;z-index:61;padding:0 12px}
.zbar button{background:#1d2026;border:1px solid #3a3f48;border-radius:4px;padding:8px 12px;font:500 15px "Fira Sans Condensed",var(--ui);letter-spacing:.05em;text-transform:uppercase;color:#e6e9ef;touch-action:none}
.zbar button.g{border-color:#4d7a2c;color:#d8ffc0}.zbar button.o{border-color:#8a5a20;color:#ffd4a0}
/* ---------- shortcuts panel ---------- */
.work{flex:1;display:flex;min-height:0}
.page{flex:1;min-width:0;display:flex;flex-direction:column}
.keyside{width:320px;flex:none;border-left:1px solid #23262b;background:var(--bar);position:sticky;top:0;align-self:flex-start;height:100dvh;display:flex;flex-direction:column}
.keyside .ks-h{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 18px;border-bottom:1px solid #23262b}
.keyside h2{margin:0;font-size:14px;font-weight:700;color:var(--hi)}
.keyside .ks-b{flex:1;overflow:auto;padding:10px 18px 18px;display:flex;flex-direction:column;gap:14px}
.keyside .kgrid{grid-template-columns:1fr;gap:12px}
.keyside .krow{font-size:12.5px;padding:3px 0}
.keyside .gest{columns:auto;font-size:12px;padding-left:16px}
@media (max-width:900px){.work{flex-direction:column}.keyside{width:auto;position:static;height:auto;border-left:0;border-top:1px solid #23262b}}
/* credits: a small bubble above its link, nothing greyed out */
.pop{position:absolute;right:16px;bottom:calc(100% - 4px);z-index:70;width:min(440px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:12px 14px 16px 18px;box-shadow:0 12px 32px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:10px;font:13px/1.55 var(--ui);color:#c9ccd2;text-align:left}
.pop .dlg-h h2{margin:0;font-size:14px;font-weight:700;color:var(--hi)}
.pop p{margin:0}

/* keyboard choice and keyboard map */
.ks-kbd{display:flex;flex-direction:column;gap:6px}
.ks-kbd .seg button{padding:7px 9px;min-height:34px}
.lnk{align-self:flex-start;background:none;border:0;padding:0;font:12.5px var(--ui);color:#b4b8bf;text-decoration:underline;text-underline-offset:2px}
.lnk:hover{color:#fff}
.floatwin.map{width:min(1000px,calc(100vw - 16px))}
/* ---------- the controller map ---------- */
.floatwin.plan{width:min(860px,calc(100vw - 16px))}
.fw-grip{position:absolute;right:2px;bottom:2px;width:16px;height:16px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 0 55%,#6f757e 55% 62%,transparent 62% 72%,#6f757e 72% 79%,transparent 79%)}
/* the controller panel: nothing in it is squeezed when the mapping list is opened */
.gear.midi>*{flex-shrink:0}
.pbody svg{display:block;width:100%;height:auto;font-family:Arimo,Arial,sans-serif}
.p-body{fill:#2b2e33;stroke:#4a4f57;stroke-width:.5}.p-mix{fill:#3a3e45;stroke:#555b63;stroke-width:.4}
.p-brand{fill:#8b9099;font-weight:700}
.p-key{fill:#15171a;stroke:var(--c,#6f757e);stroke-width:.45}.p-knob{fill:#15171a;stroke:var(--c,#6f757e);stroke-width:.5}.p-tick{stroke:#cfd3d9;stroke-width:.5}

.p-jog{fill:#1b1d21;stroke:var(--c,#6f757e);stroke-width:.6}.p-jogin{fill:#24272c;stroke:#3a3e45;stroke-width:.3}

.p-t{fill:#e6e8ec;font-weight:700;dominant-baseline:auto}.p-t.p-sub{fill:#9aa0a8;font-weight:400}.p-t.p-lab{fill:#cfd3d9}

.pleg span{display:inline-flex;align-items:center;gap:6px;margin-right:14px;font-size:12.5px;color:var(--dim)}

.rfiles{font:12.5px var(--mono);color:var(--dim)}
.rbtns{display:flex;gap:8px}
.scan{height:3px;background:#1c1f24;border-radius:2px;overflow:hidden}.scan i{display:block;height:100%;width:0;background:var(--info);transition:width .2s}
.legend{margin:-8px 0 0;font:12px var(--mono);color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid #23262b;border-radius:8px;overflow:hidden}
.stat{padding:11px 15px;border-right:1px solid #23262b;display:flex;flex-direction:column;gap:2px}
.stat b{font:500 19px var(--mono);color:var(--hi)}
.stat span{font-size:12px;color:var(--dim)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{display:flex;align-items:center;gap:8px;border:1px solid var(--edge2);border-radius:6px;background:transparent;padding:7px 12px;min-height:36px;font-size:13px;color:var(--fg)}

.rtable{border:1px solid #23262b;border-radius:8px;overflow:hidden}

.rth{padding:9px 16px;background:var(--panel);font:600 11.5px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.rrow{border-top:1px solid #23262b}
.rrow summary{list-style:none;cursor:pointer;padding:12px 16px}
.rrow summary::-webkit-details-marker{display:none}
.rrow summary:hover{background:#141518}
.rrow[open]{background:#131416}
.lvl{display:flex;align-items:center;gap:8px;font-size:13px}
.lvl.bad{color:#f08a84}.lvl.warn{color:#f0bd6e}.lvl.info{color:#a9bfe3}.lvl.ok{color:#9fcf9f}
.cat{font-size:13px;color:var(--dim)}
.ttl{font-size:14px;color:var(--fg)}
.num{font:500 13px var(--mono);text-align:right;color:var(--fg)}
.more{padding:0 16px 14px 344px;display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.55;color:#b4b8bf}
.more p{margin:0}

.h2{margin:8px 0 0;font:600 11.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
